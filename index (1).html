<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abiha's 2nd Birthday Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde7ee;--bg2:#e9ddfb;--ink:#4a2350;--pink:#f06a9b;--gold:#e8b13a;--sky:#7cc4e8;--card:#fffafc;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fde7ee;--bg2:#e9ddfb;--ink:#4a2350;--card:#fffafc}}
:root[data-theme="dark"]{--bg:#fde7ee;--bg2:#e9ddfb;--ink:#4a2350;--card:#fffafc}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Fredoka','Trebuchet MS',sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2));min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;width:100%;height:100%}
.balloons{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.b{position:absolute;bottom:-140px;width:56px;height:70px;border-radius:50% 50% 48% 48%;opacity:0}
.b:after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:60px;background:#9a7aa5}
.go .b{animation:rise var(--d) ease-in var(--dl) infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}50%{transform:translateY(-60vh) translateX(18px)}100%{transform:translateY(-125vh) translateX(-14px);opacity:.9}}
/* gate */
#gate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:linear-gradient(180deg,var(--bg),var(--bg2));transition:opacity .8s,transform .8s;text-align:center;padding:24px}
#gate.out{opacity:0;transform:scale(1.15);pointer-events:none}
.gift{font-size:96px;animation:bob 1.6s ease-in-out infinite;cursor:pointer;background:none;border:0}
@keyframes bob{50%{transform:translateY(-10px)}}
.gate h2{font-family:Pacifico,cursive;font-weight:400;font-size:28px}
.tap{background:var(--pink);color:#fff;border:0;border-radius:40px;padding:14px 34px;font:600 18px Fredoka,sans-serif;cursor:pointer;box-shadow:0 8px 0 #c94a7a;transition:transform .1s,box-shadow .1s}
.tap:active{transform:translateY(6px);box-shadow:0 2px 0 #c94a7a}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* card */
main{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:36px 20px 60px;text-align:center}
.hero{opacity:0;transform:scale(.6) rotate(-6deg)}
.go .hero{animation:pop 1s cubic-bezier(.2,1.5,.4,1) .3s forwards}
@keyframes pop{to{opacity:1;transform:none}}
.photo{position:relative;width:min(84vw,330px);aspect-ratio:1;margin:0 auto;animation:bob 3s ease-in-out infinite}
.photo img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 10px 18px rgba(74,35,80,.18))}
@keyframes spin{to{transform:rotate(360deg)}}
.two{position:absolute;right:-8px;bottom:-14px;width:84px;height:84px;border-radius:50%;background:var(--gold);color:#fff;font:600 54px/84px Fredoka,sans-serif;box-shadow:0 6px 0 #c28f1f;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(10deg) scale(1.08)}}
h1{font-family:Pacifico,cursive;font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1.2;margin:34px 0 6px;color:var(--pink)}
.nm{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.35em;letter-spacing:.02em}
.sub{font-size:19px;opacity:.85}
.in{opacity:0;transform:translateY(24px)}
.go .in{animation:up .8s ease forwards var(--t)}
@keyframes up{to{opacity:1;transform:none}}
.panel{background:var(--card);border-radius:28px;padding:22px 20px;margin-top:22px;box-shadow:0 10px 0 rgba(74,35,80,.08)}
.panel .big{font-size:26px;font-weight:600}
.panel .sm{font-size:17px;opacity:.8;margin-top:4px}
.btns{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.btn{display:block;text-decoration:none;color:#fff;font-weight:600;font-size:18px;border-radius:40px;padding:15px;transition:transform .15s}
.btn:hover{transform:scale(1.03)}
.map{background:var(--sky);color:#12384c;box-shadow:0 7px 0 #5aa3c8}
.wa{background:#2bb673;box-shadow:0 7px 0 #1f8c58}
.foot{margin-top:26px;font-family:Pacifico,cursive;font-size:22px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>

<div class="balloons" id="bl" aria-hidden="true"></div>

<div id="gate">
  <button class="gift" id="gift" aria-label="Open invitation">🎁</button>
  <h2>You have an invitation!</h2>
  <button class="tap" id="open">Tap to open</button>
</div>

(function(){

var c=document.getElementById('fx'),x=c.getContext('2d'),P=[],run=false;
function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);
function burst(){for(var i=0;i<140;i++)P.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*15-3,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%5],l:0});

 if(P.length)requestAnimationFrame(loop);else run=false}

})();
